<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master of Miracles - DS3 Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { dsGold: '#d4af37', dsDarkBg: '#090a0f', dsCardBg: '#141722', dsBorder: '#2b3042', dsEmerald: '#10b981', dsYellow: '#eab308' }, fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }}}}
    </script>
    <style>
        html {
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }
        body {
            background-color: #090a0f;
        }
        .gold-glow {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }
        .custom-checkbox {
            width: 1.6rem;
            height: 1.6rem;
            accent-color: #d4af37;
            cursor: pointer;
        }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="border-b border-dsBorder bg-[#11131c] sticky top-0 z-30 shadow-2xl px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-10 h-10 rounded bg-dsCardBg border border-dsGold/40 flex items-center justify-center hover:bg-dsGold hover:text-black text-dsGold transition">
                <i class="fa-solid fa-house"></i>
            </a>
            <div>
                <h1 class="font-cinzel text-lg font-bold text-dsGold">Master of Miracles</h1>
                <p class="text-[10px] text-gray-400">38 Miracles (Miracles Tracker)</p>
            </div>
        </div>
        <button id="menuBtn" class="text-dsGold text-2xl px-3 py-1 hover:text-white transition focus:outline-none">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Sidebar Right Drawer -->
    <div id="drawerMenu" class="fixed inset-y-0 right-0 w-72 bg-[#0d0f17] border-l border-dsGold/40 transform translate-x-full transition-transform duration-300 z-50 shadow-[0_0_30px_rgba(0,0,0,0.8)] flex flex-col">
        <div class="p-4 border-b border-dsBorder flex justify-between items-center bg-[#141722]">
            <span class="font-cinzel text-dsGold font-bold text-lg"><i class="fa-solid fa-compass mr-2"></i> MENU</span>
            <button id="closeMenuBtn" class="text-gray-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
            <div class="space-y-2">
                <a href="index.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-dsGold transition"><i class="fa-solid fa-house w-5"></i> หน้าแรก (Home)</a>
                <a href="rings.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-dsGold transition"><i class="fa-solid fa-ring w-5"></i> Rings Tracker</a>
                <a href="gestures.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-dsGold transition"><i class="fa-solid fa-person-praying w-5"></i> Gestures Tracker</a>
                <a href="sorceries.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-dsGold transition"><i class="fa-solid fa-hat-wizard w-5"></i> Sorceries Tracker</a>
                <a href="pyromancies.html" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-dsGold transition"><i class="fa-solid fa-fire w-5"></i> Pyromancies Tracker</a>
                <a href="miracles.html" class="flex items-center gap-3 p-3 rounded-lg bg-dsGold/10 border border-dsGold/30 text-dsGold transition"><i class="fa-solid fa-sun w-5"></i> Miracles Tracker</a>
            </div>
            <hr class="border-dsBorder my-2">
            <div id="authZone" class="min-h-[60px] flex items-center justify-center"></div>
            <hr class="border-dsBorder my-2">
            <button id="exportBtn" class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-white transition"><i class="fa-solid fa-download w-5 text-dsGold"></i> Export Backup</button>
            <label class="flex items-center gap-3 p-3 rounded-lg text-gray-300 hover:bg-dsCardBg hover:text-white transition cursor-pointer">
                <i class="fa-solid fa-upload w-5 text-dsGold"></i> Import Backup
                <input type="file" id="importInput" accept=".json" class="hidden">
            </label>
            <button id="resetBtn" class="flex items-center gap-3 p-3 rounded-lg text-red-400 hover:bg-red-500/10 transition mt-auto"><i class="fa-solid fa-rotate-right w-5"></i> Reset Progress</button>
        </div>
    </div>
    <div id="drawerOverlay" class="fixed inset-0 bg-black/60 hidden z-40 backdrop-blur-sm transition-opacity"></div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="bg-dsCardBg border border-dsGold/40 rounded-xl p-4 mb-6 gold-glow">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs uppercase font-bold text-gray-400 font-cinzel">ความคืบหน้า (Progress)</span>
                <span id="statsText" class="text-sm font-bold text-dsGold">0 / 38 (0%)</span>
            </div>
            <div class="w-full bg-gray-900 rounded-full h-2.5 mb-4 border border-gray-700/60"><div id="progressBar" class="bg-gradient-to-r from-yellow-500 to-dsGold h-full transition-all duration-300" style="width: 0%"></div></div>
            
            <div class="relative w-full mb-4">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-dsGold"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาปาฏิหาริย์ (Miracles)..." class="w-full bg-dsDarkBg border-2 border-dsGold/60 rounded-lg pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-dsGold shadow-inner">
            </div>

            <!-- Filters Zone -->
            <div class="flex flex-col gap-3 text-xs font-semibold">
                <!-- Status Filter -->
                <div class="flex flex-wrap gap-2 items-center">
                    <span class="text-gray-400 mr-1">สถานะ:</span>
                    <button data-status="all" class="filter-btn px-3 py-1.5 rounded-md bg-dsGold text-black font-bold">ทั้งหมด</button>
                    <button data-status="obtained" class="filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">เก็บแล้ว</button>
                    <button data-status="remaining" class="filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">ยังไม่ได้</button>
                </div>

                <!-- Type / Source Filter -->
                <div class="flex flex-wrap gap-2 items-center pt-2 border-t border-dsBorder/40">
                    <span class="text-gray-400 mr-1">ที่มา/ประเภท:</span>
                    <button data-type="all" class="type-filter-btn px-3 py-1.5 rounded-md bg-dsGold/20 text-dsGold border border-dsGold/40 font-bold">ทั้งหมด</button>
                    <button data-type="npc" class="type-filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">NPC / Tome</button>
                    <button data-type="boss" class="type-filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">Soul บอส</button>
                    <button data-type="loot" class="type-filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">เก็บตามฉาก</button>
                    <button data-type="covenant" class="type-filter-btn px-3 py-1.5 rounded-md text-gray-400 hover:text-white bg-dsDarkBg border border-dsBorder">Covenant</button>

                    <button data-type="dlc" class="type-filter-btn px-3 py-1.5 rounded-md text-cyan-400 hover:text-white bg-dsDarkBg border border-cyan-500/40"><i class="fa-solid fa-snowflake mr-1"></i>DLC</button>
                </div>
            </div>
        </div>
        <div id="listContainer" class="space-y-3"></div>
    </main>

    <script type="module">
        import { initUI } from './js/ui.js';
        import { initAuth } from './js/auth.js';
        import { initTracker } from './js/tracker.js';
        import { MIRACLES_DATA } from './js/data/miracles.js';

        document.addEventListener('DOMContentLoaded', async () => {
            initUI();
            const user = await initAuth();
            initTracker('miracles', MIRACLES_DATA, user);
        });
    </script>
</body>
</html>
