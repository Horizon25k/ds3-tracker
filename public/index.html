<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Souls 3 - Trophy Tracker Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { dsGold: '#d4af37', dsDarkBg: '#090a0f', dsCardBg: '#141722', dsBorder: '#2b3042' }, fontFamily: { cinzel: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }}}}
    </script>
    <style>body { background-color: #090a0f; } .gold-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }</style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col items-center justify-center p-6 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    
    <!-- Title Header -->
    <div class="text-center mb-10">
        <i class="fa-solid fa-fire-flame-curved text-6xl text-dsGold mb-4 drop-shadow-[0_0_15px_rgba(212,175,55,0.6)]"></i>
        <h1 class="font-cinzel text-4xl md:text-5xl font-bold text-dsGold tracking-widest mb-2">DARK SOULS III</h1>
        <p class="text-gray-400 uppercase tracking-widest text-sm">Ultimate Trophy Tracker</p>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 w-full max-w-6xl">
        <!-- Master of Rings -->
        <a href="rings.html" class="flex flex-col items-center justify-center p-6 rounded-2xl bg-dsCardBg border-2 border-dsBorder hover:border-dsGold hover:bg-[#1a1e2d] transition-all duration-300 group gold-glow">
            <i class="fa-solid fa-ring text-4xl text-dsGold mb-3 group-hover:scale-110 transition-transform"></i>
            <h2 class="font-cinzel text-lg font-bold text-white group-hover:text-dsGold text-center">Master of Rings</h2>
        </a>

        <!-- Master of Gestures -->
        <a href="gestures.html" class="flex flex-col items-center justify-center p-6 rounded-2xl bg-dsCardBg border-2 border-dsBorder hover:border-dsGold hover:bg-[#1a1e2d] transition-all duration-300 group gold-glow">
            <i class="fa-solid fa-person-praying text-4xl text-dsGold mb-3 group-hover:scale-110 transition-transform"></i>
            <h2 class="font-cinzel text-lg font-bold text-white group-hover:text-dsGold text-center">Master of Gestures</h2>
        </a>

        <!-- Master of Sorceries -->
        <a href="sorceries.html" class="flex flex-col items-center justify-center p-6 rounded-2xl bg-dsCardBg border-2 border-dsBorder hover:border-dsGold hover:bg-[#1a1e2d] transition-all duration-300 group gold-glow">
            <i class="fa-solid fa-hat-wizard text-4xl text-dsGold mb-3 group-hover:scale-110 transition-transform"></i>
            <h2 class="font-cinzel text-lg font-bold text-white group-hover:text-dsGold text-center">Master of Sorceries</h2>
        </a>

        <!-- Master of Pyromancies -->
        <a href="pyromancies.html" class="flex flex-col items-center justify-center p-6 rounded-2xl bg-dsCardBg border-2 border-dsBorder hover:border-dsGold hover:bg-[#1a1e2d] transition-all duration-300 group gold-glow">
            <i class="fa-solid fa-fire text-4xl text-dsGold mb-3 group-hover:scale-110 transition-transform"></i>
            <h2 class="font-cinzel text-lg font-bold text-white group-hover:text-dsGold text-center">Master of Pyromancies</h2>
        </a>
    </div>

    <!-- Footer Link -->
    <footer class="mt-12 text-center">
        <a href="https://github.com/Horizon25k/ds3-tracker" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-dsCardBg border border-dsGold/40 text-dsGold hover:bg-dsGold hover:text-black font-cinzel font-bold text-xs transition">
            <i class="fa-brands fa-github text-base"></i> VIEW ON GITHUB
        </a>
    </footer>
</body>
</html>
